name: Publish Python package release

on:
    release:
        types: [published]

jobs:
    build-and-release:
        if: ${{ !github.event.release.prerelease && !github.event.release.draft && startsWith(github.event.release.tag_name, 'v') }}
        permissions:
            contents: write
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Validate stable release tag
              id: tag
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: bash .github/scripts/tag-version.sh "$RELEASE_TAG" stable

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install build tooling
              run: |
                  python -m pip install --upgrade pip
                  pip install build wheel

            - name: Build distributions
              env:
                  SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.tag.outputs.package_version }}
              run: |
                  python -m build
                  ls -lh dist

            - name: Upload wheels to the published release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" ./dist/*.whl

            - name: Update permanent index release with all wheels
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  # Create the "index" release if it doesn't exist (idempotent)
                  gh release view index --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
                    gh release create index \
                      --repo "$GITHUB_REPOSITORY" \
                      --title "index" \
                      --notes "All released wheels for pip/uv --find-links" \
                      --latest=false

                  # Upload current wheels to the index release (overwrite if same filename)
                  gh release upload index \
                    --repo "$GITHUB_REPOSITORY" \
                    ./dist/*.whl \
                    --clobber
