name: Build & Push to ECR

on:
    push:
        branches: [main]
        paths-ignore:
            - '*.md'
            - '.gitignore'

permissions:
    id-token: write
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    ECR_REGISTRY: 696036763958.dkr.ecr.eu-central-1.amazonaws.com
    ECR_REPOSITORY: aureka-app/rage-api

jobs:
    build-push:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Set image tag
              id: tag
              run: |
                  SHORT_SHA=$(git rev-parse --short HEAD)
                  echo "tag=v${SHORT_SHA}-${{ github.run_number }}" >> $GITHUB_OUTPUT

            - uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: arn:aws:iam::696036763958:role/github-ecr-push-role-5466eb0
                  aws-region: eu-central-1

            - uses: aws-actions/amazon-ecr-login@v2
            - uses: docker/setup-buildx-action@v4

            - uses: docker/build-push-action@v7
              with:
                  context: .
                  file: Dockerfile
                  target: api
                  push: true
                  tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
                  cache-from: type=gha,scope=api
                  cache-to: type=gha,mode=max,scope=api
