name: Check Python package

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_call:
    inputs:
      package-version:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set tagged package version
        if: ${{ inputs.package-version != '' }}
        env:
          PACKAGE_VERSION: ${{ inputs.package-version }}
        run: echo "SETUPTOOLS_SCM_PRETEND_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m compileall -q src && python -m build
