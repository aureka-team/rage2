services:
    rage-devcontainer:
        image: rage-devcontainer
        container_name: rage-devcontainer
        build:
            context: .
            dockerfile: docker/devcontainer/Dockerfile
        volumes:
            - .:/workspace:cached
            - ./resources/:/resources
        env_file:
            - .env
        entrypoint: ["tail", "-f", "/dev/null"]
        depends_on:
            - rage-redis
            - rage-qdrant
        networks:
            - rage

    rage-core:
        image: rage-core
        container_name: rage-core
        build:
            context: .
            dockerfile: ./docker/core/Dockerfile
        volumes:
            - $PWD/resources:/resources
            - $PWD/notebooks:/notebooks
        env_file:
            - .env
        networks:
            - rage

    rage-redis:
        image: redis:8.10.1
        container_name: rage-redis
        volumes:
            - $PWD/resources/cache/redis:/data
        deploy:
            resources:
                limits:
                    memory: 192M
        restart: unless-stopped
        networks:
            - rage

    rage-qdrant:
        image: qdrant/qdrant:v1.19.0
        container_name: rage-qdrant
        ports:
            - "6333:6333"
            - "6334:6334"
        volumes:
            - ./resources/db/qdrant:/qdrant/storage
        restart: unless-stopped
        networks:
            - rage

networks:
    rage:
        name: rage
        driver: bridge
